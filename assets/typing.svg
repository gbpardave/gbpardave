<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
<style>
  text { font: 20px Iosevka, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5eead4; }
</style>
<rect x="0.5" y="0.5" width="199" height="59" rx="12" fill="#05070a" stroke="#5eead4" stroke-opacity="0.25"/>
<clipPath id="line1">
  <rect x="18" y="10" width="0" height="40">
    <animate attributeName="width" values="0;140;140;0;0" keyTimes="0;0.15;0.45;0.5;1" dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="line2">
  <rect x="18" y="10" width="0" height="40">
    <animate attributeName="width" values="0;0;0;140;140;0" keyTimes="0;0.5;0.55;0.85;0.95;1" dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<text x="18" y="36" clip-path="url(#line1)">$ whoami</text>
<text x="18" y="36" clip-path="url(#line2)">gbpardave</text>
<rect width="3" height="24" y="16" fill="#5eead4">
  <animate attributeName="x" calcMode="discrete"
    values="114;114;114;126;126;126;114;114"
    keyTimes="0;0.15;0.45;0.5;0.55;0.85;0.95;1"
    dur="6s" begin="0s" repeatCount="indefinite"/>
